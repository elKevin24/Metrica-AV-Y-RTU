<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%" style="background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradientes y Sombras Sutiles -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>
    
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>

    <linearGradient id="roseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff1f2" />
    </linearGradient>

    <!-- Marcadores de Flechas -->
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Encabezado de la Gráfica -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#dbeafe" />
    <text x="80" y="16" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">FLUJO OPERATIVO</text>
    <text x="175" y="17" fill="#64748b" font-size="13" font-weight="500">Agencia Virtual &amp; RTU Digital · 135,628 Expedientes</text>
    <text x="0" y="52" fill="#0f172a" font-size="22" font-weight="800">El Viaje de una Gestión: Del Ingreso al Desenlace</text>
  </g>

  <!-- ==================== LÍNEAS CONECTORAS (CURVAS) ==================== -->
  <g fill="none" stroke-width="2">
    <!-- Paso 1 -> Paso 2 -->
    <path d="M 230 250 L 305 250" stroke="#cbd5e1" marker-end="url(#arrowGray)" />
    
    <!-- Paso 2 -> Paso 3 -->
    <path d="M 475 250 L 545 250" stroke="#cbd5e1" marker-end="url(#arrowGray)" />

    <!-- Paso 3 -> Bifurcación Superior (Aprobada FTR 62.2%) -->
    <path d="M 715 250 C 765 250, 765 170, 815 170" stroke="#10b981" stroke-dasharray="4 3" marker-end="url(#arrowGreen)" />
    
    <!-- Paso 3 -> Bifurcación Inferior (Observada 37.6%) -->
    <path d="M 715 250 C 765 250, 765 350, 815 350" stroke="#f59e0b" stroke-dasharray="4 3" marker-end="url(#arrowAmber)" />

    <!-- Observada -> Subsanada (46.7%) -->
    <path d="M 985 350 C 1020 350, 1020 310, 1045 310" stroke="#10b981" marker-end="url(#arrowGreen)" />

    <!-- Observada -> Deserción 72h (53.3%) -->
    <path d="M 985 350 C 1020 350, 1020 420, 1045 420" stroke="#ef4444" marker-end="url(#arrowRose)" />
  </g>

  <!-- ETIQUETAS SOBRE CONECTORES -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <!-- Badge 62.2% Aprobada -->
    <rect x="735" y="185" width="62" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="766" y="199" fill="#047857">62.2%</text>

    <!-- Badge 37.6% Observada -->
    <rect x="735" y="285" width="62" height="20" rx="10" fill="#fffbeb" stroke="#fde68a" />
    <text x="766" y="299" fill="#b45309">37.6%</text>
  </g>

  <!-- ==================== TARJETAS / PASOS ==================== -->

  <!-- PASO 1: INGRESO DIGITAL -->
  <g transform="translate(60, 175)" filter="url(#cardShadow)">
    <rect width="170" height="150" rx="16" fill="url(#blueGrad)" stroke="#bfdbfe" stroke-width="1.5" />
    <!-- Punto Azul -->
    <circle cx="28" cy="30" r="10" fill="#3b82f6" />
    <text x="28" y="34" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">1</text>
    <text x="48" y="34" fill="#1e40af" font-size="11" font-weight="800" letter-spacing="0.5">INGRESO</text>
    
    <text x="20" y="66" fill="#0f172a" font-size="14" font-weight="700">Ciudadano</text>
    <text x="20" y="86" fill="#475569" font-size="11" leading="14">Carga de CUI y datos</text>
    <text x="20" y="102" fill="#475569" font-size="11">DPI frente + dorso</text>
    <text x="20" y="118" fill="#475569" font-size="11">Video selfie biométrico</text>

    <rect x="16" y="128" width="138" height="14" rx="4" fill="#dbeafe" />
    <text x="85" y="138" fill="#1e40af" font-size="9" font-weight="700" text-anchor="middle">135,628 EXPEDIENTES</text>
  </g>

  <!-- PASO 2: ESPERA EN BUZÓN -->
  <g transform="translate(305, 175)" filter="url(#cardShadow)">
    <rect width="170" height="150" rx="16" fill="url(#amberGrad)" stroke="#fde68a" stroke-width="1.5" />
    <!-- Punto Ámbar -->
    <circle cx="28" cy="30" r="10" fill="#f59e0b" />
    <text x="28" y="34" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">2</text>
    <text x="48" y="34" fill="#b45309" font-size="11" font-weight="800" letter-spacing="0.5">COLA / ESPERA</text>

    <text x="20" y="66" fill="#0f172a" font-size="14" font-weight="700">Buzón Regional</text>
    <text x="20" y="86" fill="#475569" font-size="11">Trámite en espera</text>
    <text x="20" y="104" fill="#d97706" font-size="14" font-weight="800">~9h 29m hábiles</text>
    <text x="20" y="120" fill="#64748b" font-size="10">(98.2% del tiempo total)</text>

    <rect x="16" y="128" width="138" height="14" rx="4" fill="#fef3c7" />
    <text x="85" y="138" fill="#92400e" font-size="9" font-weight="700" text-anchor="middle">CUELLO DE BOTELLA</text>
  </g>

  <!-- PASO 3: REVISIÓN HUMANA -->
  <g transform="translate(545, 175)" filter="url(#cardShadow)">
    <rect width="170" height="150" rx="16" fill="url(#blueGrad)" stroke="#bfdbfe" stroke-width="1.5" />
    <!-- Punto Azul -->
    <circle cx="28" cy="30" r="10" fill="#3b82f6" />
    <text x="28" y="34" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">3</text>
    <text x="48" y="34" fill="#1e40af" font-size="11" font-weight="800" letter-spacing="0.5">REVISIÓN</text>

    <text x="20" y="66" fill="#0f172a" font-size="14" font-weight="700">Auditor Fiscal</text>
    <text x="20" y="86" fill="#475569" font-size="11">Cotejo vs. Padrón</text>
    <text x="20" y="104" fill="#2563eb" font-size="14" font-weight="800">1 a 3 minutos</text>
    <text x="20" y="120" fill="#64748b" font-size="10">(Revisión activa ágil)</text>

    <rect x="16" y="128" width="138" height="14" rx="4" fill="#dbeafe" />
    <text x="85" y="138" fill="#1e40af" font-size="9" font-weight="700" text-anchor="middle">161 AUDITORES</text>
  </g>

  <!-- PASO 4A: APROBADA 1er INTENTO (FTR) -->
  <g transform="translate(815, 110)" filter="url(#cardShadow)">
    <rect width="170" height="115" rx="16" fill="url(#emeraldGrad)" stroke="#6ee7b7" stroke-width="2" />
    <!-- Punto Verde -->
    <circle cx="28" cy="28" r="10" fill="#10b981" />
    <text x="28" y="32" fill="#ffffff" font-size="10" font-weight="900" text-anchor="middle">✓</text>
    <text x="46" y="32" fill="#047857" font-size="11" font-weight="800">APROBADA (FTR)</text>

    <text x="20" y="60" fill="#065f46" font-size="20" font-weight="800">62.2%</text>
    <text x="20" y="78" fill="#047857" font-size="12" font-weight="600">84,406 Casos Limpios</text>
    <text x="20" y="96" fill="#64748b" font-size="10">Resolución al 1er intento</text>
  </g>

  <!-- PASO 4B: OBSERVADA CON RECHAZO -->
  <g transform="translate(815, 290)" filter="url(#cardShadow)">
    <rect width="170" height="120" rx="16" fill="url(#amberGrad)" stroke="#fcd34d" stroke-width="1.5" />
    <!-- Punto Ámbar -->
    <circle cx="28" cy="28" r="10" fill="#f59e0b" />
    <text x="28" y="32" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">4</text>
    <text x="46" y="32" fill="#b45309" font-size="11" font-weight="800">OBSERVADA</text>

    <text x="20" y="60" fill="#92400e" font-size="20" font-weight="800">37.6%</text>
    <text x="20" y="78" fill="#b45309" font-size="12" font-weight="600">51,027 Casos con Error</text>
    <text x="20" y="96" fill="#78350f" font-size="10">76.8% fotos DPI borrosas</text>
    <text x="20" y="110" fill="#94a3b8" font-size="9">Plazo: 72h para subsanar</text>
  </g>

  <!-- RAMA FINAL 1: SUBSANADA CON ÉXITO -->
  <g transform="translate(1045, 265)">
    <rect width="115" height="70" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2" />
    <circle cx="16" cy="20" r="5" fill="#10b981" />
    <text x="28" y="23" fill="#047857" font-size="10" font-weight="700">Subsanada</text>
    <text x="14" y="46" fill="#065f46" font-size="14" font-weight="800">46.7%</text>
    <text x="14" y="60" fill="#047857" font-size="9">(23,823 rescatados)</text>
  </g>

  <!-- RAMA FINAL 2: DESERCIÓN 72H -->
  <g transform="translate(1045, 375)">
    <rect width="115" height="70" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2" />
    <circle cx="16" cy="20" r="5" fill="#ef4444" />
    <text x="28" y="23" fill="#b91c1c" font-size="10" font-weight="700">Deserción 72h</text>
    <text x="14" y="46" fill="#991b1b" font-size="14" font-weight="800">53.3%</text>
    <text x="14" y="60" fill="#b91c1c" font-size="9">(27,204 abandonan)</text>
  </g>

  <!-- ==================== PIE / CONCLUSIÓN ==================== -->
  <g transform="translate(60, 520)">
    <rect width="1100" height="60" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="30" cy="30" r="10" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.5" />
    <text x="30" y="34" fill="#2563eb" font-size="11" font-weight="800" text-anchor="middle">i</text>
    <text x="55" y="27" fill="#0f172a" font-size="12" font-weight="700">Conclusión de Flujo:</text>
    <text x="185" y="27" fill="#475569" font-size="12">El trámite toma menos de 3 minutos en evaluarse; el 98% del tiempo se consume esperando en el buzón.</text>
    <text x="55" y="45" fill="#64748b" font-size="11">Cuando el trámite se observa, más de la mitad (53.3%) se pierde permanentemente por vencimiento en las 72 horas.</text>
  </g>
</svg>
